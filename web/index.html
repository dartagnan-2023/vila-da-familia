<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vila Raízes — Edição Aldeia</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>

"headline-xl":["Space Mono","monospace"],"label-sm":["Space Mono","monospace"],"headline-md":["Space Mono","monospace"],"label-md":["Space Mono","monospace"]},"fontSize":{"headline-lg-mobile":["20px",{"lineHeight":"28px","letterSpacing":"-0.5px","fontWeight":"700"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"body-sm":["12px",{"lineHeight":"16px","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.5px","fontWeight":"700"}],"body-lg":["16px",{"lineHeight":"24px","fontWeight":"400"}],"label-lg":["14px",{"lineHeight":"16px","letterSpacing":"0.5px","fontWeight":"700"}],"headline-xl":["32px",{"lineHeight":"40px","letterSpacing":"-1px","fontWeight":"700"}],"label-sm":["10px",{"lineHeight":"12px","letterSpacing":"1px","fontWeight":"700"}],"headline-md":["18px",{"lineHeight":"24px","fontWeight":"700"}],"label-md":["12px",{"lineHeight":"14px","letterSpacing":"0.5px","fontWeight":"700"}]}}}}

<style>
  html,body{margin:0;padding:0}
  body{overscroll-behavior:none;font-family:'Space Mono',monospace;image-rendering:pixelated}
  *{border-radius:0 !important}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#e7d9bb}
  ::-webkit-scrollbar-thumb{background:#8f4d24;border:2px solid #221b08}
  /* Terra da vila: xadrez de pixel, sem imagem externa. */
  .chao{background-color:#8fae5d;background-image:
      linear-gradient(45deg,rgba(45,76,30,.16) 25%,transparent 25%,transparent 75%,rgba(45,76,30,.16) 75%),
      linear-gradient(45deg,rgba(45,76,30,.16) 25%,transparent 25%,transparent 75%,rgba(45,76,30,.16) 75%);
      background-size:16px 16px;background-position:0 0,8px 8px}
  .scanlines{background-image:repeating-linear-gradient(0deg,rgba(34,27,8,.06) 0 2px,transparent 2px 4px)}
  .press:active{transform:translateY(4px)}
  .pisca{animation:pisca 1s steps(2,start) infinite}
  @keyframes pisca{to{opacity:.35}}
  [hidden]{display:none !important}
  #topo nav{overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  #topo nav::-webkit-scrollbar{display:none}
  @media (max-width:1023px){ #hud .w-28{width:5.5rem} #hud .w-44{width:8rem} }
</style>
</head>
<body class="bg-background font-body-md text-body-md text-on-background min-h-screen">

<!-- PORTA DE ENTRADA: criar a vila ou entrar com a chave da família -->
<div class="fixed inset-0 z-[100] bg-inverse-surface/90 scanlines flex items-center justify-center p-gutter-md" id="entrada"></div>

<header class="lg:sticky lg:top-0 z-50 bg-secondary shadow-[0_4px_0_0_#331200]" id="topo"></header>
<div class="sticky top-0 lg:top-20 z-40 bg-surface-dim shadow-[0_4px_0_0_#221b08] px-gutter-xs lg:px-panel-pad-md py-pixel-step" id="hud"></div>
<div id="caixa"></div>

<main class="w-full">
  <div class="max-w-[1600px] mx-auto grid grid-cols-1 lg:grid-cols-[320px_minmax(0,1fr)_320px] gap-gutter-md p-gutter-md items-start">
    <aside class="order-2 lg:order-1" id="ecos"></aside>
    <section class="order-1 lg:order-2 min-h-[520px]" id="palco"></section>
    <aside class="order-3 space-y-gutter-sm" id="painel"></aside>
  </div>
</main>

<footer class="sticky bottom-0 z-40 bg-surface-container-high shadow-[0_-4px_0_0_#331200] px-gutter-sm py-gutter-xs" id="hotbar"></footer>

<div class="fixed inset-0 z-[90] bg-inverse-surface/80 flex items-center justify-center p-gutter-md" hidden id="modal"></div>
<div aria-live="polite" class="fixed bottom-28 left-1/2 -translate-x-1/2 z-[95] flex flex-col items-center gap-1" id="avisos"></div>

<script src="./app.js" type="module"></script>
</body>
</html>
