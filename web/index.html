<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#7cb342">
<title>Vila Raízes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;900&display=swap">
<style>
  :root{
    --grass:#7cb342; --grass2:#8bc34a; --soil:#8d5524; --soil-wet:#5d3a1a; --water:#4fc3f7; --sand:#e6c98f;
    --paper:#fff6e5; --paper2:#ffe9c2; --ink:#3e2723; --ink2:#6d4c41; --orange:#ff8f00; --orange2:#e65100;
    --good:#43a047; --gold:#ffc107; --red:#e53935; --sky:#b3e5fc; --shadow:0 6px 0 rgba(62,39,35,.18);
  }
  html,body{height:100%}
  body{margin:0;background:#2e7d32;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:16px;overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
  .phone{height:100%;max-width:430px;margin:0 auto;background:var(--grass);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.2)}

  /* topo: só o que importa */
  .topo{padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;display:flex;align-items:center;gap:8px;background:linear-gradient(var(--sky),rgba(179,229,252,0));position:relative;z-index:5}
  .pill{display:flex;align-items:center;gap:6px;background:var(--paper);border-radius:999px;padding:6px 12px;box-shadow:var(--shadow);font-family:"Baloo 2",sans-serif;font-weight:800;font-size:18px;line-height:1}
  .pill small{font-family:"Nunito";font-weight:700;font-size:12px;color:var(--ink2)}
  .nivel{width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--orange) var(--xp,40%),var(--paper2) 0);display:grid;place-items:center;box-shadow:var(--shadow)}
  .nivel span{width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:15px}
  .alerta{margin-left:auto;position:relative;width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
  .alerta b{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-family:"Baloo 2";animation:pulsa 1.2s infinite}
  @keyframes pulsa{50%{transform:scale(1.18)}}

  /* o mundo: rola pra baixo, tudo é tocável */
  .mundo{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px 120px}
  .titulo{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:19px;margin:14px 4px 6px;display:flex;align-items:center;gap:8px;text-shadow:0 1px 0 rgba(255,255,255,.5);white-space:nowrap;min-width:0}
  .titulo small{white-space:normal;line-height:1.1}
  .titulo .chip.acao{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange2)}
  .titulo small{font-family:"Nunito";font-weight:700;font-size:13px;color:var(--ink2);text-shadow:none}
  .fazenda{background:var(--grass2);border:4px solid #c68642;border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;box-shadow:var(--shadow)}
  .fazenda.minha{border-color:var(--gold)}
  .fazenda .dono{position:absolute;top:-14px;left:12px;background:var(--paper);border-radius:999px;padding:3px 10px;font-family:"Baloo 2";font-weight:800;font-size:14px;box-shadow:var(--shadow)}
  .canteiro{aspect-ratio:1;border-radius:12px;background:var(--soil);display:grid;place-items:center;font-size:36px;position:relative;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .1s}
  .canteiro:active{transform:scale(.94)}
  .canteiro.vazio{background:var(--soil);background-image:repeating-linear-gradient(0deg,transparent 0 10px,rgba(0,0,0,.08) 10px 12px)}
  .canteiro.vazio::after{content:"+";color:rgba(255,255,255,.55);font-family:"Baloo 2";font-size:34px;font-weight:800}
  .canteiro.crescendo{background:var(--soil-wet)}
  .canteiro.pronto{background:var(--soil-wet);animation:brilho 1.4s infinite}
  @keyframes brilho{50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 4px var(--gold)}}
  .canteiro .barra{position:absolute;left:8px;right:8px;bottom:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.3)}
  .canteiro .barra i{display:block;height:100%;border-radius:3px;background:var(--good);width:var(--p,0%)}
  .canteiro .pede{position:absolute;top:-8px;right:-8px;width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:17px;box-shadow:var(--shadow);animation:pulsa 1s infinite}
  .canteiro .tempo{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}

  /* a rua: quem faz as encomendas */
  .rua{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 10px 8px;background:var(--sand);border-radius:18px;box-shadow:var(--shadow)}
  .loja{background:var(--paper);border-radius:14px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;box-shadow:0 4px 0 rgba(62,39,35,.15)}
  .loja:active{transform:scale(.95)}
  .loja .ic{font-size:34px;line-height:1}
  .loja .nm{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.02em}
  .loja.pronta{background:var(--gold);animation:brilho 1.4s infinite}
  .loja .bilhete{position:absolute;top:-8px;right:-4px;background:var(--paper);border-radius:8px;font-size:14px;padding:1px 4px;box-shadow:var(--shadow)}
  .loja.pronta .bilhete{background:var(--red);color:#fff;font-family:"Baloo 2";font-weight:800}

  .poco{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
  .poco .ic{font-size:36px}
  .poco .txt{flex:1;font-weight:700;font-size:14px}
  .poco .txt b{display:block;font-family:"Baloo 2";font-size:17px}
  .barrao{height:10px;border-radius:5px;background:var(--paper2);overflow:hidden;margin-top:4px}
  .barrao i{display:block;height:100%;background:var(--good);width:var(--p,0%)}

  /* embaixo: três botões, grandes */
  .rodape{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--paper);box-shadow:0 -4px 0 rgba(62,39,35,.12);position:relative;z-index:5}
  .rodape button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;font-family:"Baloo 2";font-weight:800;font-size:14px;position:relative}
  .rodape button .ic{font-size:26px;line-height:1}
  .rodape button.ativo{background:var(--paper2)}
  .rodape button b{position:absolute;top:2px;right:14px;background:var(--red);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;font-size:11px}

  /* folha que sobe de baixo: uma decisão por vez */
  .veu{position:absolute;inset:0;background:rgba(62,39,35,.45);z-index:20;display:flex;align-items:flex-end}
  .folha{width:100%;background:var(--paper);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow-y:auto;animation:sobe .22s ease-out}
  @keyframes sobe{from{transform:translateY(40px);opacity:0}}
  .folha h2{font-family:"Baloo 2";font-weight:800;font-size:22px;margin:0 0 4px;text-wrap:balance}
  .folha p{margin:0 0 12px;color:var(--ink2);font-weight:700;font-size:14px}
  .cartoes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .cartao{background:var(--paper2);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow);text-align:center}
  .cartao:active{transform:scale(.96)}
  .cartao .ic{font-size:40px;line-height:1}
  .cartao .nm{font-family:"Baloo 2";font-weight:800;font-size:18px}
  .cartao .dt{font-size:12px;font-weight:700;color:var(--ink2)}
  .cartao.bloq{opacity:.45}
  .cartoes.tres{grid-template-columns:repeat(3,1fr);gap:8px}
  .cartoes.tres .cartao{padding:10px 6px}
  .cartoes.tres .cartao .ic{font-size:32px}
  .cartoes.tres .cartao .nm{font-size:15px}
  .cartoes.tres .cartao .dt{font-size:11px}
  .lista{display:flex;flex-direction:column;gap:8px}
  .item{display:flex;align-items:center;gap:10px;background:var(--paper2);border-radius:14px;padding:10px 12px}
  .item .ic{font-size:28px}
  .item .txt{flex:1;font-weight:700;font-size:14px;min-width:0}
  .item .txt b{display:block;font-family:"Baloo 2";font-size:16px}
  .btn{background:var(--orange);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:16px;padding:10px 16px;border-radius:999px;box-shadow:0 4px 0 var(--orange2);white-space:nowrap}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--orange2)}
  .btn.fraco{background:var(--paper);color:var(--ink);box-shadow:0 4px 0 rgba(62,39,35,.2)}
  .btn.cheio{width:100%;margin-top:12px;font-size:18px;padding:14px}
  .fechar{position:absolute;right:14px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--paper2);font-size:18px;font-weight:900}
  .folha{position:relative}
  .balao{background:var(--paper2);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;max-width:85%}
  .balao.meu{background:#dcedc8;margin-left:auto}
  .balao small{display:block;font-size:11px;color:var(--ink2);font-weight:900;text-transform:uppercase}
  .conversa{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
  .linha{display:flex;gap:8px}
  .linha input{flex:1;font:inherit;font-weight:700;padding:10px 14px;border-radius:999px;border:2px solid var(--paper2);background:#fff;color:var(--ink)}
  .quem{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .quem button{background:var(--paper2);border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px}
  .quem button.on{background:var(--ink);color:#fff}

  /* avisos e mão do tutorial */
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:110px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-family:"Baloo 2";font-weight:800;font-size:16px;z-index:30;box-shadow:var(--shadow);animation:sobe .2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  .toast.bom{background:var(--good)}
  .moeda{position:absolute;font-family:"Baloo 2";font-weight:800;font-size:22px;color:var(--gold);text-shadow:0 2px 0 var(--orange2);z-index:30;animation:voa 1s forwards;pointer-events:none}
  @keyframes voa{to{transform:translateY(-70px);opacity:0}}
  .guia{position:absolute;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;z-index:15;font-weight:700;font-size:15px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:sobe .3s}
  .guia .ic{font-size:26px}
  .guia button{margin-left:auto;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:900;font-size:13px;flex:none}
  .phone:has(.veu) .mao{display:none}
  .mao{position:absolute;z-index:16;font-size:40px;pointer-events:none;animation:aponta .9s infinite;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
  @keyframes aponta{50%{transform:translate(-8px,-8px)}}
  /* desktop: tres colunas, nada muda de lugar na cabeca de quem joga no celular */
  @media (min-width:960px){
    body{background:#5a9a3a}
    .phone{max-width:none;box-shadow:none}
    .topo{max-width:1400px;margin:0 auto;width:100%}
    .rodape{display:none}
    .mundo{padding:0 20px 40px}
    .mundo>.bloco{min-width:0}
    .mundo{display:grid;grid-template-columns:minmax(360px,420px) minmax(420px,1fr) minmax(360px,420px);gap:0 20px;align-items:start;max-width:1400px;margin:0 auto;width:100%}
    .bloco.a{grid-column:1;grid-row:1} .bloco.d{grid-column:1;grid-row:2}
    .bloco.b{grid-column:2;grid-row:1} .bloco.e{grid-column:2;grid-row:2}
    .bloco.c{grid-column:3;grid-row:1/3}
    .veu{align-items:center;justify-content:center}
    .folha{max-width:560px;border-radius:22px;max-height:85vh}
    .guia{left:50%;transform:translateX(-50%);max-width:560px;bottom:24px}
    .toast{bottom:40px}
    .canteiro{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  input{font:inherit}
  .empurra{margin-left:auto}
  .titulo .chip{margin-left:auto;font-family:"Nunito";font-weight:900;font-size:12px;background:var(--paper);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow);text-shadow:none}
  .fazenda.outra{grid-template-columns:repeat(6,1fr);padding:8px;gap:6px}
  .outra .canteiro{font-size:24px;border-radius:9px}
  .outra .canteiro.vazio::after{font-size:22px}
  .outra .canteiro .barra{left:4px;right:4px;bottom:3px;height:4px}
  .outra .canteiro .pede{width:24px;height:24px;font-size:13px;top:-6px;right:-6px}
  .outra .canteiro .tempo{display:none}
  .canteiro{min-width:0}
  .canteiro.maquina{background:var(--paper2);font-size:30px}
  .canteiro.maquina .tempo{color:var(--ink);text-shadow:none;font-size:10px}
  .canteiro.compra{background:rgba(255,255,255,.35);border:3px dashed rgba(255,255,255,.7);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:13px;text-align:center;line-height:1.1}
  .canteiro.compra::after{content:none}
  .ferramentas{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .ferramentas button{flex:1;min-width:70px;background:var(--paper);border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:900;font-size:12px;box-shadow:var(--shadow)}
  .ferramentas button .ic{font-size:24px;line-height:1}
  .ferramentas button.desc{opacity:.55}
  .ferramentas button small{font-weight:700;color:var(--ink2);font-size:10px}
  .loja{min-width:0}
  .cartaz{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);width:100%;text-align:left}
  .cartaz .ic{font-size:36px;flex:none}
  .cartaz .txt{flex:1;font-weight:700;font-size:14px;min-width:0}
  .cartaz .txt b{display:block;font-family:"Baloo 2";font-size:17px}
  .folha{max-height:85%}
  .folha h2{margin-right:36px}
  .folha h3{font-family:"Baloo 2";font-weight:800;font-size:17px;margin:14px 0 6px}
  .item{width:100%;text-align:left}
  .item .ic{flex:none}
  .item.apagado{opacity:.55}
  .item.duas{flex-wrap:wrap}
  .item.duas .acoes{display:flex;gap:8px;width:100%;justify-content:flex-end}
  .item.duas .acoes .btn{font-size:14px;padding:8px 14px}
  .btn{flex:none}
  .btn.cheio{white-space:normal}
  .btn.zap{background:#25d366;box-shadow:0 4px 0 #128c7e}
  .btn[disabled]{opacity:.45}
  .balao{overflow-wrap:anywhere}
  .conversa{max-height:38vh;overflow-y:auto}
  .linha input{min-width:0}
  .campo{width:100%;font-weight:700;padding:12px 14px;border-radius:14px;border:2px solid var(--paper2);background:#fff;color:var(--ink);margin-bottom:8px;font-size:16px}
  .chave{font-family:"Baloo 2";font-weight:800;font-size:22px;text-align:center;letter-spacing:.04em;background:var(--paper2);border-radius:14px;padding:10px;user-select:all;margin:6px 0 10px}
  .mini{font-size:12px;color:var(--ink2);font-weight:700}
  .toast.ruim{background:var(--red)}
  .entrada{position:absolute;inset:0;z-index:40;background:var(--grass);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
  .entrada .caixa{background:var(--paper);border-radius:22px;padding:20px;width:100%;max-width:400px;box-shadow:var(--shadow)}
  .entrada h1{font-family:"Baloo 2";font-weight:800;font-size:28px;margin:0;text-align:center}
  .entrada .sub{text-align:center;color:var(--ink2);font-weight:700;margin:2px 0 16px}
  .entrada details{margin-top:14px}
  .entrada summary{font-weight:900;cursor:pointer;color:var(--ink2)}
  .mundo{overscroll-behavior:contain;padding-bottom:130px}
  .nivel{flex:none}
  .redondo{position:relative;width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow);flex:none}
  .redondo b{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-family:"Baloo 2";animation:pulsa 1.2s infinite}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="entrada" id="entrada"></div>
  <div class="topo" id="topo"></div>
  <div class="mundo" id="mundo"></div>
  <div class="rodape" id="rodape"></div>
</div>
<script src="./app.js" type="module"></script>
</body>
</html>
